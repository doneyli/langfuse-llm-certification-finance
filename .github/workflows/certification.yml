name: LLM Certification

on:
  # Manual trigger with configurable model
  workflow_dispatch:
    inputs:
      model:
        description: 'Model to certify'
        required: false
        default: 'claude-sonnet-4-6'
      threshold:
        description: 'Pass threshold (0.0-1.0)'
        required: false
        default: '0.85'

  # Auto-trigger on changes to prompts, evaluators, or certification config
  push:
    branches: [main]
    paths:
      - 'evaluators.py'
      - 'run_certification.py'
      - 'setup_prompts.py'
      - 'agents/**'
      - 'run_usecase_certification.py'
      - 'cert_common.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - '.env.example'

# Four gate jobs, each a real experiment against Langfuse costing real LLM
# tokens. Without this, a burst of pushes to main queues several full sets and
# they all bill. A newer commit supersedes an older one, so cancel the old run.
concurrency:
  group: certification-${{ github.ref }}
  cancel-in-progress: true

env:
  LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
  LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
  LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

jobs:
  certify-financebench:
    name: FinanceBench Certification
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Run FinanceBench certification
        # Inputs go through env indirection (never interpolated into the shell
        # script) so a crafted dispatch input cannot inject commands.
        env:
          MODEL: ${{ github.event.inputs.model || 'claude-sonnet-4-6' }}
          THRESHOLD: ${{ github.event.inputs.threshold || '0.85' }}
        run: |
          uv run python run_certification.py \
            --dataset certification/financebench-sample \
            --model "$MODEL" \
            --threshold "$THRESHOLD" \
            --ci

  certify-fpb:
    name: FPB Sentiment Certification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Run FPB sentiment certification
        env:
          MODEL: ${{ github.event.inputs.model || 'claude-sonnet-4-6' }}
          THRESHOLD: ${{ github.event.inputs.threshold || '0.85' }}
        run: |
          uv run python run_certification.py \
            --dataset certification/fpb-sample \
            --model "$MODEL" \
            --threshold "$THRESHOLD" \
            --ci

  certify-usecase:
    name: 10-K Analyst Use-Case Certification
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Run 10-K analyst use-case certification
        env:
          MODEL: ${{ github.event.inputs.model || 'claude-sonnet-4-6' }}
        run: |
          uv run python run_usecase_certification.py \
            --use-case 10k-analyst \
            --dataset certification/financebench-sample \
            --model "$MODEL" \
            --ci

  pytest-gate:
    name: Pytest Certification Gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [certify-financebench, certify-fpb, certify-usecase]
    if: always()

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Run certification tests
        env:
          CERT_MODEL: ${{ github.event.inputs.model || 'claude-sonnet-4-6' }}
          CERT_THRESHOLD: ${{ github.event.inputs.threshold || '0.85' }}
        run: uv run pytest tests/test_certification.py -v --tb=short
